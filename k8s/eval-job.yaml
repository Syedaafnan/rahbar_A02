# The Part B evaluation suite as a Kubernetes Job (A03 F2), against the LIVE api.
# It writes a timestamped result file to the eval-results volume and exits 1 (Job
# Failed) when the release gate fails. Thresholds: ConfigMap rahbar-gate (/config).
#
#   kubectl -n rahbar delete job eval --ignore-not-found
#   kubectl apply -f k8s/eval-job.yaml
#   kubectl -n rahbar logs -f job/eval
#   kubectl -n rahbar get job eval          # COMPLETIONS 1/1 = gate passed; Failed = rejected
#
# The first run on a fresh cluster has no baseline yet: run k8s/eval-baseline-job.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: eval
  namespace: rahbar
  labels: { app.kubernetes.io/name: eval, app.kubernetes.io/part-of: rahbar }
spec:
  backoffLimit: 0                 # a failed gate is an answer, not a crash: never retry it
  activeDeadlineSeconds: 21600    # 6 h: CPU-only LLM, ~90 s per answer incl. the judge; --repeat 2 needs ~2 h
  template:
    metadata:
      labels: { app.kubernetes.io/name: eval, app.kubernetes.io/part-of: rahbar }
    spec:
      restartPolicy: Never
      serviceAccountName: rahbar-eval
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: eval
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          args: ["suite.py", "--api", "http://api:8000", "--label", "live", "--gate"]
          envFrom:
            - configMapRef: { name: rahbar-config }     # the live model, prefixes, collection
          env:
            - { name: HOME, value: /tmp }
            - { name: JUDGE, value: llm }               # llm | overlap | none
            - { name: JUDGE_PROVIDER, value: ollama }   # ollama | hosted (needs LLM_API_KEY)
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: rahbar-secret, key: LLM_API_KEY, optional: true }
          # Measured with `kubectl top pod` during a run (A03 F5): the suite only waits on
          # HTTP; peak ~30m CPU / ~60Mi.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: results, mountPath: /results }
            - { name: gate, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: results
          persistentVolumeClaim: { claimName: eval-results }
        - name: gate
          configMap: { name: rahbar-gate }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
