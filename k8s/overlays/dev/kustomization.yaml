# Local minikube: images built with `make images` and loaded with
# `minikube image load`, so the tag is `dev` and nothing is pulled.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - { name: rahbar-api, newTag: dev }
  - { name: rahbar-ui, newTag: dev }
  - { name: rahbar-indexer, newTag: dev }
