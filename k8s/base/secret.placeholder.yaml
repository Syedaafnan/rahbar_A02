# DOCUMENTATION ONLY. Never list this file in kustomization.yaml: applying it would
# overwrite the real Secret with a placeholder.
#
# Create the real one from the command line (never from a file you commit):
#   export LLM_API_KEY=...            # e.g. a Groq key, only for LLM_PROVIDER=hosted
#   kubectl create secret generic rahbar-secret -n rahbar \
#     --from-literal=LLM_API_KEY="$LLM_API_KEY"
#
# Base64 is an encoding, not encryption: anyone who can read this manifest could
# decode a real value in one command. That is why only REPLACE_ME lives here.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
