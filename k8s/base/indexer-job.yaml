# The indexer: ingestion WITH verification (A03 Part A), and the ONLY writer to Chroma
# (section 4.2, ADR 0001). Runs once, exits, and is re-run from the CronJob's template:
#   kubectl create job --from=cronjob/reindex ingest-1 -n rahbar
#   python scripts/run_indexer.py                 # same, then waits and prints the logs
#
# One run = the data management lifecycle of the paper (Figure 3):
#   ingest (fetch + every batch in lake/raw) -> verify (4 checks) -> update the data
#   lake (quarantine / archive) -> update the retrieval sources (embed only new chunks)
#
# Its pod template is kept identical to reindex-cronjob.yaml on purpose (same image,
# same args, same limits). If you change one, change the other.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: corpus-data
  labels: { app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar }
spec:
  # The data lake: raw batches, quarantine, archived versions, registry, reports.
  # Survives pod restarts and Job deletion (A03 F1).
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  labels: { app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar }
spec:
  backoffLimit: 2                 # three attempts in total, then the Job is Failed
  activeDeadlineSeconds: 3600     # a hung OCR run must not hold the volume forever
  template:
    metadata:
      labels: { app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rahbar-indexer
      # No CHROMA_PORT=tcp://... style variables from Services: chroma reads every
      # CHROMA_* variable as config and crashes on them; we use DNS names instead.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Step 1: download the documents in corpus/sources.yaml into the base batch of
        # the data lake. Files already there are kept, so re-indexing downloads nothing.
        - name: fetch-corpus
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/corpus/fetch.py"]
          env:
            - { name: CORPUS_RAW, value: /data/lake/raw/base }
            - { name: CORPUS_MANIFEST_OUT, value: /data/state/MANIFEST.fetched.md }
            - { name: HOME, value: /tmp }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: indexer
          image: rahbar-indexer
          imagePullPolicy: IfNotPresent
          args: []                      # ingest; scripts/run_indexer.py adds --count-by-doc etc.
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - { name: HOME, value: /tmp }
          # Requests and limits from `kubectl top pod` during a full ingest with OCR
          # (A03 F5, numbers in docs/A03-REPORT.md and eval/results/resources-*.txt).
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # read-write: verification moves failed files to lake/quarantine and copies
            # superseded versions to lake/archive (A03 A1/A2)
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: corpus-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi             # pdf2image rasterises scanned pages here
