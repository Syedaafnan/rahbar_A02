# Weekly re-index with the SAME image and arguments as the indexer Job. It is also the
# template for an on-demand run, with no redeploy and no downtime:
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  labels: { app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar }
spec:
  schedule: "0 3 * * 0"           # Sundays 03:00
  timeZone: Asia/Karachi
  # Forbid: a second indexer must never start while one is still writing (one writer).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels: { app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar }
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar }
        spec:
          restartPolicy: OnFailure
          serviceAccountName: rahbar-indexer
          # No CHROMA_PORT=tcp://... style variables from Services: chroma reads every
          # CHROMA_* variable as config and crashes on them; we use DNS names instead.
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: fetch-corpus
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              command: ["python", "/app/corpus/fetch.py"]
              env:
                - { name: CORPUS_RAW, value: /corpus }
                - { name: CORPUS_MANIFEST_OUT, value: /corpus/MANIFEST.fetched.md }
                - { name: HOME, value: /tmp }
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - { name: corpus, mountPath: /corpus }
                - { name: tmp, mountPath: /tmp }
          containers:
            - name: indexer
              image: rahbar-indexer
              imagePullPolicy: IfNotPresent
              args: []
              envFrom:
                - configMapRef:
                    name: rahbar-config
              env:
                - { name: HOME, value: /tmp }
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - { name: corpus, mountPath: /corpus, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: corpus
              persistentVolumeClaim:
                claimName: corpus-data
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
