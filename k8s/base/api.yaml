# The api: reads the index on every question, never writes it (section 4.2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: rahbar }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # add one new pod at a time ...
      maxUnavailable: 0    # ... and never drop below 3 ready pods while doing it
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: rahbar }
    spec:
      serviceAccountName: rahbar-api
      # No CHROMA_PORT=tcp://... style variables from Services: chroma reads every
      # CHROMA_* variable as config and crashes on them; we use DNS names instead.
      enableServiceLinks: false
      automountServiceAccountToken: false
      # preStop sleep (10 s) + uvicorn finishing its in-flight requests must fit inside
      # this. One answer can take two LLM calls of up to LLM_TIMEOUT_SECONDS (150 s), so
      # 30 s cut answers off mid-generation during a rollout (a 502 in
      # docs/evidence/rollout.txt). 360 s matches the Ingress proxy-read-timeout; an
      # idle pod still exits as soon as the preStop sleep ends.
      terminationGracePeriodSeconds: 360
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: rahbar-api
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: rahbar-config }
          env:
            - name: HOME
              value: /tmp
            - name: LLM_API_KEY          # only used when LLM_PROVIDER=hosted
              valueFrom:
                secretKeyRef: { name: rahbar-secret, key: LLM_API_KEY, optional: true }
          # Numbers from `kubectl top pods` under load: docs/evidence/kubectl-top.txt.
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Finished booting? Liveness and readiness wait until this passes.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Still alive? Touches no dependency, so a slow Chroma never restarts us.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2
          # Can it take traffic? Chroma + non-empty collection + Redis + embedding pin.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal propagates to the Ingress and
              # kube-proxy, so no request lands on a pod that has stopped listening.
              exec: { command: ["sleep", "10"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        # usage / requests.cpu. See docs/ENGINEERING-NOTES.md Q3 for why CPU is a weak
        # signal for an I/O-bound generation service.
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
