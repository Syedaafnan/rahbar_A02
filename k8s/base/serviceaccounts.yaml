# One ServiceAccount per workload (section 4.7). None of our pods talk to the
# Kubernetes API server, so none of them gets a token mounted, and no Role or
# RoleBinding exists: each account can do nothing at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-ui
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-indexer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-chroma
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rahbar-redis
automountServiceAccountToken: false
