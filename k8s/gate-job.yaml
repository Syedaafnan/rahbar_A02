# Re-apply the release gate to STORED result files (A03 F2): seconds, not an hour.
# This is the "changing a threshold changes the outcome without rebuilding the image"
# demo: edit the rahbar-gate ConfigMap, re-run this Job, compare the decisions.
#
#   kubectl -n rahbar delete job gate --ignore-not-found
#   kubectl apply -f k8s/gate-job.yaml && kubectl -n rahbar logs -f job/gate
#   kubectl -n rahbar patch configmap rahbar-gate --type merge -p "$(cat k8s/gate-strict.patch.json)"
#   kubectl -n rahbar delete job gate && kubectl apply -f k8s/gate-job.yaml && kubectl -n rahbar logs -f job/gate
#
# CANDIDATE_FILE: latest-candidate.json (written by eval-candidate), or latest-bad.json.
apiVersion: batch/v1
kind: Job
metadata:
  name: gate
  namespace: rahbar
  labels: { app.kubernetes.io/name: eval, app.kubernetes.io/part-of: rahbar }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: { app.kubernetes.io/name: eval, app.kubernetes.io/part-of: rahbar }
    spec:
      restartPolicy: Never
      serviceAccountName: rahbar-eval
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gate
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          args: ["gate.py", "--candidate", "/results/latest-candidate.json",
                 "--baseline", "/results/baseline.json", "--config", "/config/gate.yaml",
                 "--out", "/results/gate-decision.json"]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: results, mountPath: /results }
            - { name: gate, mountPath: /config, readOnly: true }
      volumes:
        - name: results
          persistentVolumeClaim: { claimName: eval-results }
        - name: gate
          configMap: { name: rahbar-gate }
