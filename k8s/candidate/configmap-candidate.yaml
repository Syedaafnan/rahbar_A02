# The CANDIDATE change (A03 C1): a different EMBEDDING MODEL, mxbai-embed-large
# (1024 dimensions, 335M parameters) instead of nomic-embed-text (768, 137M).
# Everything else is identical to rahbar-config, so the comparison isolates one change.
#
# Its own collection (rahbar-mxbai), built by k8s/candidate/indexer-candidate-job.yaml,
# so the live collection is never touched while the candidate is tested (F3).
# mxbai's task prefixes: an instruction for queries, nothing for passages.
#
# A release (python scripts/release.py promote) points the LIVE Deployment at this
# ConfigMap; `kubectl rollout undo deployment/api` points it back at rahbar-config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config-candidate
  labels:
    app.kubernetes.io/part-of: rahbar
    rahbar/release: candidate
data:
  # --- implementations -------------------------------------------------------
  RETRIEVER: "chroma"
  LLM_PROVIDER: "ollama-host"          # stub | ollama-host | ollama-incluster | hosted
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  HOSTED_BASE_URL: "https://api.groq.com/openai/v1"

  # --- the embedding pin (section 4.4) ---------------------------------------
  # The indexer writes this into the Chroma collection metadata; the api refuses to
  # become ready if the two disagree.
  EMBED_MODEL: "mxbai-embed-large"
  # A03: task prefixes belong to the model, so they live next to it. A candidate
  # model brings its own (k8s/candidate/configmap-candidate.yaml).
  EMBED_QUERY_PREFIX: "Represent this sentence for searching relevant passages: "
  EMBED_DOC_PREFIX: ""

  # --- vector store and cache ------------------------------------------------
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar-mxbai"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # --- indexing (unit: approximate tokens; measured in docs/PIPELINE.md) ------
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  # --- A03 data lake (PVC corpus-data, mounted at /data in the indexer) ---------
  # lake/raw/<batch>/ incoming · lake/quarantine/ failed verification ·
  # lake/archive/ superseded versions · state/ registry · reports/ per-run reports
  DATA_DIR: "/data"
  CORPUS_DIR: "/data/lake/raw"
  # Whole-document cosine at or above this = near-duplicate. Calibrated on our corpus:
  # distinct documents reach 0.956 at most, the reworded copy 0.995
  # (eval/results/near-dup-calibration.txt).
  NEAR_DUP_THRESHOLD: "0.96"

  # --- querying --------------------------------------------------------------
  TOP_K: "5"
  # Below this cosine similarity a passage is not evidence; if nothing clears it the
  # api abstains without calling the model (section 3.4). 0.60 sits below every
  # answerable golden question's best passage (lowest 0.69) and above off-topic
  # questions on the fixtures (0.56); see docs/PIPELINE.md, "Relevance floor".
  RELEVANCE_FLOOR: "0.60"
  # Prompt budget for a CPU-only model (~22 prompt tokens/s measured on our laptop):
  # retrieval still returns TOP_K passages, but only the best 3 above the floor go to
  # the LLM, each cut to 180 words (~1,000 prompt tokens, ~75 s instead of >150 s).
  LLM_CONTEXT_PASSAGES: "3"
  LLM_PASSAGE_WORDS: "180"
  LLM_TIMEOUT_SECONDS: "150"
  # Semantic cache hit threshold: the lowest value with zero false hits on
  # eval/cache_pairs.yaml. 0.95 is ruled out: "...warning in MS programs?" and
  # "...in BS programs?" score 0.9521 and need different answers (docs/PIPELINE.md).
  CACHE_THRESHOLD: "0.96"
  CACHE_TTL_SECONDS: "86400"
  # 0.1: answers are facts extracted into strict JSON; we want the same answer for
  # the same evidence, not creativity. (0 to 0.3 is the band from section 3.4.)
  TEMPERATURE: "0.1"
  # A03: a fixed seed, so the same evidence gives the same answer (stochasticity test).
  LLM_SEED: "42"
  # A03: every query writes one trace line to stdout AND appends it here (PVC traces).
  TRACE_DIR: "/traces"

  LOG_LEVEL: "INFO"
