# The candidate api has the same paths as the live api, but only the eval Jobs may
# call it (no Ingress, no ui).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-candidate
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api-candidate }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: eval }
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: chroma }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: redis }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 11434 }
        - { protocol: TCP, port: 443 }
