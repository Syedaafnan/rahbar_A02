# The BASELINE evaluation (A03 B and C1): the suite against the live api, run TWICE
# with fixed seeds (the stochasticity test), saved as /results/baseline.json for the
# release gate to compare candidates with.
#
#   kubectl -n rahbar delete job eval-baseline --ignore-not-found
#   kubectl apply -f k8s/eval-baseline-job.yaml && kubectl -n rahbar logs -f job/eval-baseline
apiVersion: batch/v1
kind: Job
metadata:
  name: eval-baseline
  namespace: rahbar
  labels: { app.kubernetes.io/name: eval, app.kubernetes.io/part-of: rahbar }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels: { app.kubernetes.io/name: eval, app.kubernetes.io/part-of: rahbar }
    spec:
      restartPolicy: Never
      serviceAccountName: rahbar-eval
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: eval
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          args: ["suite.py", "--api", "http://api:8000", "--label", "baseline",
                 "--repeat", "2", "--save-baseline"]
          envFrom:
            - configMapRef: { name: rahbar-config }
          env:
            - { name: HOME, value: /tmp }
            - { name: JUDGE, value: llm }
            - { name: JUDGE_PROVIDER, value: ollama }
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: rahbar-secret, key: LLM_API_KEY, optional: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: results, mountPath: /results }
            - { name: gate, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: results
          persistentVolumeClaim: { claimName: eval-results }
        - name: gate
          configMap: { name: rahbar-gate }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
